[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytm"
version = "0.3.0"
description = "A minimal terminal-based YouTube music player."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "krizxjr" }]
dependencies = [
    "yt-dlp>=2024.10.22",
    "rich>=13.7.0",
    "readchar>=4.1.0",
    "dbus-next>=0.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ytm = "ytm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
